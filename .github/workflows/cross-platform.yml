name: Cross-platform compatibility

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

# Locked-down GITHUB_TOKEN. Job steps only need to clone + run npm/test; no
# write access required. Closes the CodeQL actions/missing-workflow-permissions
# advisory.
permissions:
  contents: read

concurrency:
  group: cross-platform-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: ${{ matrix.os }} / Node ${{ matrix.node-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node-version: [20.x, 22.x]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        # Gate on high+ severity. Two moderate advisories are currently
        # accepted/tracked: an unfixable infinite-loop in `file-type` (transitive
        # via @nut-tree-fork/nut-js -> jimp, no patched release exists) and an
        # XSS in `ip-address` (via the MCP SDK's express-rate-limit). Revisit to
        # `moderate` once upstream ships fixes (see issue #117).
        run: npm audit --audit-level=high --omit=dev

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Typecheck tests
        run: npm run typecheck:tests

      - name: MCP schema snapshot
        run: npm run test:mcp-schema-snapshot

      - name: Build
        run: npm run build

      # The macOS helpers and overlay are compiled on the user's Mac at first use (mac-swift-binary.ts: swiftc -O); a compile
      # error there silently disables pauses or the accessibility helper. Compile every script the same way here.
      - name: Compile the macOS Swift scripts
        if: runner.os == 'macOS'
        run: |
          for f in scripts/mac/*.swift; do
            echo "swiftc -O $f"
            swiftc -O "$f" -o "$RUNNER_TEMP/$(basename "$f" .swift)" || exit 1
          done

      # The benchmark's native fixtures (bench/, issue #384). The Windows one is built and self-tested by the unit tests.
      # macOS: compiled, then its self-test (no window is shown) must record the state the tasks read.
      - name: Build and self-test the benchmark's macOS fixture
        if: runner.os == 'macOS'
        run: |
          swiftc -O bench/fixtures/native/macos/BenchFixture.swift -o "$RUNNER_TEMP/BenchFixture"
          for mode in dialog editor; do
            "$RUNNER_TEMP/BenchFixture" --state "$RUNNER_TEMP/bench-$mode.json" --mode "$mode" --selftest
            cat "$RUNNER_TEMP/bench-$mode.json"; echo
          done
          grep -q '"modalResult":"ok"' "$RUNNER_TEMP/bench-dialog.json"
          grep -q '"shippingEdit":1' "$RUNNER_TEMP/bench-dialog.json"
          grep -q 'first line' "$RUNNER_TEMP/bench-editor.json"

      # Linux: GTK needs a display, so the fixture is only syntax-checked here.
      - name: Syntax-check the benchmark's Linux fixture
        if: runner.os == 'Linux'
        run: python3 -m py_compile bench/fixtures/native/linux/bench_fixture.py

      # Both projects: unit, then system (real processes, one file at a time). CLAWD_LIVE_TESTS=1 adds the system tests
      # that write the clipboard or depend on the machine's apps; they never run in a plain local `npm test`.
      - name: Run test suite
        run: npm run test:ci
        env:
          CLAWD_LIVE_TESTS: '1'

      # #117 — coverage ratchet + production-path perf tripwire. One matrix
      # cell only (ubuntu/22): thresholds are platform-independent and running
      # them 6× would just burn minutes.
      - name: Coverage gate (ratchet thresholds)
        if: matrix.os == 'ubuntu-latest' && matrix.node-version == '22.x'
        run: npm run test:coverage
        env:
          CLAWD_LIVE_TESTS: '1'

      - name: Perf smoke (production paths)
        if: matrix.os == 'ubuntu-latest' && matrix.node-version == '22.x'
        run: npm run perf:smoke

  # The Claude Desktop extension (.mcpb) is built per OS on that OS. Build and
  # smoke-test all three on every PR so a break surfaces here, not at release.
  extension:
    name: extension bundle / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: npm
      - name: Install dependencies (builds the macOS native helper on macOS)
        run: npm ci
      - name: Build
        run: npm run build
      - name: Build the .mcpb
        run: npm run build:mcpb
      - name: Smoke-test the bundle (Linux needs a display)
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get install -y -qq xvfb >/dev/null
            xvfb-run -a node scripts/smoke-mcpb.mjs
          else
            node scripts/smoke-mcpb.mjs
          fi
